[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-filing-monitor"
version = "0.1.0"
description = "A reliable SEC EDGAR filing-index pipeline with validation, idempotent incremental loading, and pipeline observability."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.13,<3",
    "duckdb>=1.5,<2",
    "pyarrow>=25,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]